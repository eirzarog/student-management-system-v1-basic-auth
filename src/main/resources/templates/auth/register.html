<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.05em;
        }

        .form-content {
            padding: 40px 35px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        label span {
            color: #f44336;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .error {
            color: #f44336;
            font-size: 0.85em;
            margin-top: 6px;
            display: block;
        }

        .error-input {
            border-color: #f44336 !important;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
        }

        .login-link p {
            color: #666;
            margin-bottom: 12px;
        }

        .btn-secondary {
            display: inline-block;
            padding: 12px 30px;
            background: #f5f5f5;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .icon {
            margin-right: 8px;
            font-size: 1.2em;
        }

        .password-hint {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="header">
        <h1>✨ Create Account</h1>
        <p>Join the Student Management System</p>
    </div>

    <div class="form-content">
        <form th:action="@{/register}" th:object="${user}" method="post">

            <div class="form-group">
                <label for="fullName">Full Name <span>*</span></label>
                <input type="text"
                       id="fullName"
                       name="fullName"
                       th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'error-input' : ''"
                       placeholder="Enter your full name"
                       required>
                <span class="error" th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}">Error</span>
            </div>

            <div class="form-group">
                <label for="username">Username <span>*</span></label>
                <input type="text"
                       id="username"
                       name="username"
                       th:field="*{username}"
                       th:classappend="${#fields.hasErrors('username')} ? 'error-input' : ''"
                       placeholder="Choose a username"
                       required>
                <span class="error" th:if="${#fields.hasErrors('username')}"
                      th:errors="*{username}">Error</span>
            </div>

            <div class="form-group">
                <label for="email">Email <span>*</span></label>
                <input type="email"
                       id="email"
                       name="email"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'error-input' : ''"
                       placeholder="your.email@example.com"
                       required>
                <span class="error" th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">Error</span>
            </div>

            <div class="form-group">
                <label for="password">Password <span>*</span></label>
                <input type="password"
                       id="password"
                       name="password"
                       th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'error-input' : ''"
                       placeholder="Create a strong password"
                       required>
                <span class="password-hint">Minimum 6 characters</span>
                <span class="error" th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}">Error</span>
            </div>

            <button type="submit" class="btn-primary">
                <span class="icon">🚀</span> Create Account
            </button>
        </form>

        <div class="login-link">
            <p>Already have an account?</p>
            <a th:href="@{/login}" class="btn-secondary">
                <span class="icon">🔐</span> Sign In
            </a>
        </div>
    </div>
</div>
</body>
</html>
